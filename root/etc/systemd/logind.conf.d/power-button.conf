# Teclas de energia/suspender/reiniciar/desligar do teclado DESATIVADAS:
# evitam suspender ou desligar o note por acidente. As acoes continuam
# disponiveis pelos menus (MOD + Esc, Ctrl + Alt + Delete, waybar).
# Fechar a tampa continua suspendendo (ver lid.conf).
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=ignore
HandleRebootKey=ignore
HandleRebootKeyLongPress=ignore
HandleSuspendKey=ignore
HandleSuspendKeyLongPress=ignore
HandleHibernateKey=ignore
HandleHibernateKeyLongPress=ignore
